# Development override — deliberately isolated from production.
#
# READ THIS BEFORE EDITING. Until 2026-08-23 this file shared EVERYTHING with production: the same
# Compose project name, the same `container_name` on every service, and the same `./data` bind
# mounts. Running the documented `npm run dev` on the production host would therefore not fail with
# a port clash — Compose would *adopt* the running production containers, stop them, and start dev
# ones in their place, with the dev backend writing to the live MariaDB data directory in
# NODE_ENV=development. Silently, with nothing to warn you.
#
# Four things keep the two stacks apart. All four are load-bearing:
#
#   1. `-p blast-arena-dev` on the command line — this is the one that actually matters, and it
#      MUST be passed. The `name:` field below is defence in depth only: Compose ranks
#      `-p` > COMPOSE_PROJECT_NAME > `name:`, and .env sets COMPOSE_PROJECT_NAME=blast-arena, so
#      `name:` alone is silently ignored here. Verified: without `-p` the merged config still
#      resolves to `name: blast-arena`. `npm run dev` passes the flag.
#   2. `container_name` on every service — the base file pins these explicitly, so a distinct
#      project name alone would still collide.
#   3. `./data-dev/…` mounts — otherwise dev writes to the production database and Redis AOF.
#   4. Distinct host ports — so both stacks can run side by side rather than fighting.
#
# `!override` is required on `ports` and `volumes`: Compose merges sequences by APPENDING, so
# without it the dev stack would publish 8280 *as well as* 8285 and mount both ./data and
# ./data-dev onto the same container paths. (audit DEV-STACK-ISOLATION-1)
#
# Guarded by tests/backend/utils/composeIsolation.test.ts.

name: blast-arena-dev

services:
  db:
    container_name: blast-arena-dev-db
    ports: !override
      - "127.0.0.1:${DEV_DB_EXTERNAL_PORT:-3317}:3306"
    volumes: !override
      - ./data-dev/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev_root_pass}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev_pass}

  redis:
    container_name: blast-arena-dev-redis
    ports: !override
      - "127.0.0.1:${DEV_REDIS_EXTERNAL_PORT:-6390}:6379"
    volumes: !override
      - ./data-dev/redis:/data

  backend:
    container_name: blast-arena-dev-backend
    build:
      dockerfile: docker/backend/Dockerfile.dev
    environment:
      NODE_ENV: development
      DB_PASSWORD: ${DB_PASSWORD:-dev_pass}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes: !override
      - ./shared:/app/shared
      - ./backend:/app/backend
      - /app/backend/node_modules
      - /app/shared/node_modules
      - ./data-dev/gamelogs:/app/gamelogs
      - ./data-dev/simulations:/app/simulations
      - ./data-dev/replays:/app/replays
      - ./data-dev/ai:/app/ai
      - ./data-dev/enemy-ai:/app/enemy-ai
      - ./docs:/app/docs:ro
    healthcheck:
      start_period: 300s

  frontend:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: frontend-dev
    container_name: blast-arena-dev-frontend
    environment:
      # APP_URL is the public origin (from .env, e.g. https://www.blastarena.at). It drives the
      # backend socket.io CORS + cookie `secure` flag AND Vite's server.allowedHosts (vite.config.ts
      # derives the allowed host from it), so it must match how the browser reaches the app.
      # Left inheriting APP_URL on purpose: commit 8bf4e62 reverted a dev-specific override
      # because it broke Vite's allowedHosts for proxied access.
      APP_URL: ${APP_URL:-http://localhost:8080}
    ports: !override
      - "127.0.0.1:${DEV_VITE_PORT:-5183}:5173"
    volumes: !override
      - ./shared:/app/shared
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/shared/node_modules
    networks:
      - internal

  nginx:
    container_name: blast-arena-dev-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: nginx-dev
    # Distinct from production's 8280 so both stacks can run at once. If you proxy the dev stack
    # through a hostname, point it here.
    ports: !override
      - "127.0.0.1:${DEV_NGINX_PORT:-8285}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
