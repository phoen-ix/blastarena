                  type: integer
                  nullable: true
                  description: Cosmetic ID to equip, or null to unequip
      responses:
        '200':
          description: Updated equipped cosmetics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquippedCosmetics'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), unknown cosmetic or wrong type for the slot (`COSMETIC_SLOT_MISMATCH`), or cosmetic no longer active (`COSMETIC_INACTIVE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Email not verified (`EMAIL_NOT_VERIFIED`), or the user does not own the cosmetic (`COSMETIC_NOT_OWNED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

