    put:
      tags: [Bot AI]
      summary: Re-upload bot AI source (admin only)
      operationId: adminReuploadAI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: TypeScript source file (.ts, max 500KB)
      responses:
        '200':
          description: AI source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: No file uploaded, compilation/validation failed, the AI is built in (`AI_BUILTIN`), not a .ts file (`INVALID_FILE_TYPE`), or another malformed upload (`INVALID_UPLOAD`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  errors:
                    type: array
                    description: Compiler messages, when compilation failed
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: AI not found (`AI_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File larger than 500 KB (`PAYLOAD_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/ai/{id}/download:
    get:
      tags: [Bot AI]
      summary: Download bot AI source (admin only)
