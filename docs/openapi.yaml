          minimum: 2
          maximum: 8
        roundTime:
          type: integer
          minimum: 30
          maximum: 600
        mapWidth:
          type: integer
          minimum: 11
          maximum: 61
        wallDensity:
          type: number
          minimum: 0
          maximum: 1
        powerUpDropRate:
          type: number
          minimum: 0
          maximum: 1
        botCount:
          type: integer
          minimum: 0
          maximum: 8
        botDifficulty:
          $ref: '#/components/schemas/BotDifficulty'
        reinforcedWalls:
          type: boolean
        enableMapEvents:
          type: boolean
        hazardTiles:
          type: boolean
        friendlyFire:
          type: boolean
        enabledPowerUps:
          type: array
          items:
            $ref: '#/components/schemas/PowerUpType'
        totalGames:
          type: integer
          minimum: 1
          maximum: 1000
        speed:
          type: string
          enum: [fast, realtime]
        logVerbosity:
          type: string
