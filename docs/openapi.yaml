      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid user ID, or deleting yourself (`SELF_ACTION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/{id}/reset-totp:
    post:
      tags: [Users Admin]
      summary: Reset a user's two-factor authentication (admin only)
      description: Disables 2FA for the user and clears their TOTP secret and backup codes.
      operationId: adminResetUserTotp
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 2FA reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid user ID, or the user does not have 2FA enabled (`TOTP_NOT_ENABLED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/cleanup/preview:
    post:
      tags: [Users Admin]
      summary: Count the accounts a cleanup would delete (admin only)
      description: Dry run of `/admin/users/cleanup/execute` with the same filter; nothing is deleted.
      operationId: adminPreviewAccountCleanup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCleanupRequest'
      responses:
        '200':
          description: Number of matching accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/cleanup/execute:
    post:
      tags: [Users Admin]
      summary: Delete the accounts matching a cleanup filter (admin only)
      description: |
        Hard-deletes every matching account (related rows are removed by foreign-key cascades),
        disconnects their sockets and writes a single `bulk_delete` audit entry. The calling admin
        is never included.
      operationId: adminExecuteAccountCleanup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCleanupRequest'
      responses:
        '200':
          description: Number of deleted accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

