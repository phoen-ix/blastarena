  # ===================== User — Two-Factor Authentication =====================
  /user/totp/setup:
    post:
      tags: [User]
      summary: Start two-factor authentication setup
      description: |
        Generates a TOTP secret (SHA-1, 6 digits, 30-second period) and 10 single-use backup codes
        and stores them on the account; 2FA stays off until `/user/totp/confirm` succeeds. Calling
        this again before confirming replaces the pending secret and codes. The backup codes are
        stored hashed, so this is the only response that contains them.
        Rate limited to 5 requests per 15 minutes per IP.
      operationId: beginTotpSetup
      responses:
        '200':
          description: Pending 2FA secret and backup codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  qrDataUri:
                    type: string
                    description: Data URI of a QR code image encoding the otpauth URI
                  secret:
                    type: string
                    description: Base32 secret for manual entry
                  backupCodes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items:
                      type: string
                      pattern: '^[0-9a-f]{4}-[0-9a-f]{4}$'
        '400':
          description: 2FA is not configured on this server (`TOTP_NOT_CONFIGURED`) or is already enabled (`TOTP_ALREADY_ENABLED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: User not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /user/totp/confirm:
    post:
      tags: [User]
      summary: Confirm two-factor authentication setup
      description: |
        Enables 2FA once a code for the pending secret from `/user/totp/setup` verifies. Accepts a
        6-digit TOTP code or one of the backup codes from that setup (a backup code used here is
        consumed). Rate limited to 5 requests per 15 minutes per IP.
      operationId: confirmTotpSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 10
                  description: 6-digit TOTP code or a backup code (`xxxx-xxxx`)
      responses:
        '200':
          description: 2FA enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), 2FA not configured on this server (`TOTP_NOT_CONFIGURED`), already enabled (`TOTP_ALREADY_ENABLED`), no setup in progress (`NO_TOTP_SETUP`), or wrong code (`INVALID_TOTP_CODE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: User not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (`RATE_LIMITED`), or 10 wrong codes for this account within 15 minutes (`TOTP_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/totp/disable:
    post:
      tags: [User]
      summary: Disable two-factor authentication
      description: |
        Requires the account password and a current TOTP code or unused backup code. Clears the
        TOTP secret and backup codes. Rate limited to 5 requests per 15 minutes per IP.
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                  minLength: 1
                code:
                  type: string
                  minLength: 6
                  maxLength: 10
                  description: 6-digit TOTP code or a backup code (`xxxx-xxxx`)
      responses:
        '200':
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), 2FA not configured on this server (`TOTP_NOT_CONFIGURED`), 2FA not enabled (`TOTP_NOT_ENABLED`), or wrong code (`INVALID_TOTP_CODE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required, or wrong password (`INVALID_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: User not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (`RATE_LIMITED`), or 10 wrong codes for this account within 15 minutes (`TOTP_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

