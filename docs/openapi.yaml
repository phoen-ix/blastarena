        '400':
          description: Invalid map ID (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: Map not found or not accessible (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Custom Maps]
      summary: Update a custom map (owner only)
      operationId: updateMap
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomMapInput'
      responses:
        '200':
          description: Map updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or invalid map ID or map data rejected by the map validator (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: Map not found or not owned by user (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Custom Maps]
      summary: Delete a custom map (owner only)
      operationId: deleteMap
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
