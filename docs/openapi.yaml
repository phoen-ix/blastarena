  /admin/campaign/levels/import:
    post:
      tags: [Campaign Admin]
      summary: Import a level (two-phase with conflict resolution, admin only)
      description: |
        `level` may be a level export (`_format: blast-arena-level`), a bundle export
        (`_format: blast-arena-level-bundle`, whose `level` and `enemyTypes` are used) or raw level
        data (bundled types then go in `enemyTypes`). A bundle export can also be posted as the body
        itself, with `worldId` added. The level is checked against the same bounds as a created
        level, and the world must exist before anything is created.
        Phase 1: without `enemyIdMap`, if any referenced enemy type ID is unknown or comes with
        bundled data, the answer is a 200 with `conflicts` and nothing is created; otherwise the
        level is created straight away.
        Phase 2: with `enemyIdMap` (original ID to existing ID, `create` from the bundled data, or
        `skip` to drop those placements) the level is created.
      operationId: adminImportLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, worldId]
              properties:
                level:
                  type: object
                  description: Level export, bundle export, or raw level data
                enemyTypes:
                  type: array
                  items:
                    $ref: '#/components/schemas/BundledEnemyType'
                  description: Bundled enemy types when `level` is raw level data
                worldId:
                  type: integer
                enemyIdMap:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: integer
                      - type: string
                        enum: [create, skip]
                  description: "Mapping of original enemy type ID to action: existing ID (number), 'create', or 'skip'"
      responses:
        '200':
          description: Phase 1 response with conflicts
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportConflict'
        '201':
          description: Level imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          description: Validation failed (`VALIDATION_ERROR`), `Invalid level data` (no name or tiles, or out of bounds; then with `details` like a validation error but no `code`), or no world with `worldId` (`WORLD_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

