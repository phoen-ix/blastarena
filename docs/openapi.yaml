    # ---- Admin ----
    AdminUserListItem:
      type: object
      description: A raw database row, so the keys are snake_case and booleans arrive as 0 or 1
      properties:
        id:
          type: integer
        username:
          type: string
        email_hint:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
