  # ===================== Seasons =====================
  /admin/seasons:
    get:
      tags: [Seasons]
      summary: List seasons (admin only)
      operationId: adminGetSeasons
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Paginated season list, newest start date first
          content:
            application/json:
              schema:
                type: object
                properties:
                  seasons:
                    type: array
                    items:
                      $ref: '#/components/schemas/Season'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Seasons]
      summary: Create a season (admin only)
      operationId: adminCreateSeason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startDate, endDate]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                startDate:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                endDate:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Season created (inactive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or `endDate` not after `startDate` (`INVALID_DATE_RANGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/seasons/{id}:
    put:
      tags: [Seasons]
      summary: Update a season (admin only)
      description: Updates only the fields sent. When `startDate` or `endDate` is sent, the range is re-checked against the stored value of the other end.
      operationId: adminUpdateSeason
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                startDate:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                endDate:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: The updated season
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), invalid ID (`INVALID_ID`), or `endDate` not after `startDate` (`INVALID_DATE_RANGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Season not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Seasons]
      summary: Delete a season (admin only)
      operationId: adminDeleteSeason
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Season deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid ID (`INVALID_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Season not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/seasons/{id}/activate:
    post:
      tags: [Seasons]
      summary: Activate a season (admin only)
      description: |
        In one transaction every season is set inactive, this one active, and a season Elo row is
        created from the current Elo for every user who has none. An unknown ID is rejected before
        anything is changed.
      operationId: adminActivateSeason
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Season activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid ID (`INVALID_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Season not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/seasons/{id}/end:
    post:
      tags: [Seasons]
      summary: End a season (admin only)
      description: Only the active season can be ended. Sets it inactive and resets every user's Elo (peak Elo is raised to the new rating where lower); an unknown or inactive season is rejected before anything is changed.
      operationId: adminEndSeason
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetMode]
              properties:
                resetMode:
                  type: string
                  enum: [hard, soft]
                  description: "'hard' sets every Elo to 1000; 'soft' halves the distance to 1000"
      responses:
        '200':
          description: Season ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Validation failed (`VALIDATION_ERROR`) or invalid ID (`INVALID_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Season not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The season is not the active one (`SEASON_NOT_ACTIVE`); nothing is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

