  # ===================== Enemy AI =====================
  /admin/enemy-ai/active:
    get:
      tags: [Enemy AI]
      summary: List active enemy AIs (staff)
      description: Available to all authenticated staff users for enemy type configuration.
      operationId: getActiveEnemyAIs
      responses:
        '200':
          description: Active enemy AI list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ais:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnemyAIEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/enemy-ai:
    get:
      tags: [Enemy AI]
      summary: List all enemy AIs (admin only)
      operationId: adminListEnemyAIs
      responses:
        '200':
          description: All enemy AIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ais:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnemyAIEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Enemy AI]
      summary: Upload a new enemy AI (admin only)
      operationId: adminUploadEnemyAI
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                  description: TypeScript source file (.ts, max 500KB)
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Enemy AI uploaded and compiled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ai:
                    $ref: '#/components/schemas/EnemyAIEntry'
        '400':
          description: No file uploaded, name missing, compilation/validation failed, not a .ts file (`INVALID_FILE_TYPE`), or another malformed upload (`INVALID_UPLOAD`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  errors:
                    type: array
                    description: Compiler messages, when compilation failed
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File larger than 500 KB (`PAYLOAD_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/enemy-ai/{id}:
    put:
      tags: [Enemy AI]
      summary: Update enemy AI metadata (admin only)
      operationId: adminUpdateEnemyAI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                isActive:
                  type: boolean
      responses:
        '200':
          description: Enemy AI updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Enemy AI not found (`AI_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Enemy AI]
      summary: Delete an enemy AI (admin only)
      operationId: adminDeleteEnemyAI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enemy AI deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Built-in enemy AIs cannot be deleted (`AI_BUILTIN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Enemy AI not found (`AI_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/enemy-ai/{id}/upload:
    put:
      tags: [Enemy AI]
      summary: Re-upload enemy AI source (admin only)
      operationId: adminReuploadEnemyAI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: TypeScript source file (.ts, max 500KB)
      responses:
        '200':
          description: Enemy AI source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: No file uploaded, compilation/validation failed, the AI is built in (`AI_BUILTIN`), not a .ts file (`INVALID_FILE_TYPE`), or another malformed upload (`INVALID_UPLOAD`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  errors:
                    type: array
                    description: Compiler messages, when compilation failed
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Enemy AI not found (`AI_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File larger than 500 KB (`PAYLOAD_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/enemy-ai/{id}/download:
    get:
