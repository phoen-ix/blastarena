              schema:
                $ref: '#/components/schemas/Error'

  /admin/campaign/enemy-types/import:
    post:
      tags: [Campaign Admin]
      summary: Import an enemy type (admin only)
      description: |
        Accepts an enemy type export. If it bundles AI source (`enemyAiSource`) and the config has an
        `enemyAiId`, the first call without `enemyAiAction` only answers `needsResolution` with any
        existing AI of the same name. The second call picks `create` (compile and add the bundled AI),
        `use-existing:<aiId>` (point the config at that existing enemy AI) or `skip` (drop
        `enemyAiId` and `difficulty` from the config).
      operationId: adminImportEnemyType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 2000
                  default: ''
                config:
                  $ref: '#/components/schemas/EnemyTypeConfig'
                enemyAiSource:
                  type: string
                  description: Bundled TypeScript source of the enemy's custom AI
                enemyAiName:
                  type: string
                enemyAiAction:
                  type: string
                  pattern: '^(create|skip|use-existing:.+)$'
      responses:
        '200':
          description: AI resolution needed (phase 1); nothing was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsResolution:
                    type: boolean
                    enum: [true]
                  conflict:
                    type: object
                    properties:
                      aiName:
                        type: string
                      existingId:
                        type: string
                        description: Present when an enemy AI with this name exists
                      existingName:
                        type: string
        '201':
          description: Enemy type imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          description: Validation failed (`VALIDATION_ERROR`), the bundled AI failed to compile (`errors` lists the compiler messages, no `code`), or the `use-existing` enemy AI does not exist (`AI_NOT_FOUND`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

