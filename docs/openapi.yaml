        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/campaign-replays/{sessionId}:
    get:
      tags: [Campaign Replays]
      summary: Get campaign replay data (staff)
      description: Rate limited to 15 requests per 10 seconds per IP; all URLs of this route share the budget.
      operationId: adminGetCampaignReplay
