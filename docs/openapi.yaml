      summary: Resend email verification link
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email sent (if email matches)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  remainingResends:
                    type: integer
                    description: Resends left for the account; 0 when the email does not match or is already verified
        '400':
          description: Email missing or not a string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limited (`RATE_LIMITED`, 1 request per 2 minutes per IP), or the account's 3 resends are used up (`RESEND_LIMIT_REACHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===================== Local Co-Op =====================
  /local-coop/login:
    post:
      tags: [Local Co-Op]
      summary: Log in as local co-op player 2
      description: |
        Authenticates P2 and sets an isolated httpOnly cookie. Requires P1 to be authenticated.
        If P2 has 2FA enabled it returns a `TotpChallengeResponse` instead (no cookie); finish with
        `/local-coop/verify-totp`.
      operationId: localCoopLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalCoopLoginRequest'
      responses:
        '200':
          description: P2 session created, or a 2FA challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LocalCoopSession'
                  - $ref: '#/components/schemas/TotpChallengeResponse'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or P2 is the same account as P1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: P1 not authenticated, or unknown P2 username or wrong password (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: P2 account deactivated (`DEACTIVATED`) or its email not verified (`EMAIL_NOT_VERIFIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /local-coop/verify-totp:
    post:
      tags: [Local Co-Op]
      summary: Complete a local co-op player 2 login with 2FA
      description: |
        Second step of `/local-coop/login` when P2 has 2FA enabled. For such accounts that call
        answers a `TotpChallengeResponse`; this one exchanges its `totpToken` and P2's TOTP code or
        unused backup code for the isolated P2 httpOnly cookie. The token is valid for 5 minutes and
        only for the P1 account that requested it. Requires P1 to be authenticated.
        Rate limited to 10 requests per 15 minutes per IP.
      operationId: localCoopVerifyTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totpToken, code]
              properties:
                totpToken:
                  type: string
                  description: Challenge token returned by `/local-coop/login`
                code:
                  type: string
                  minLength: 6
                  maxLength: 10
                  description: P2's 6-digit TOTP code or a backup code (`xxxx-xxxx`)
                duration:
                  type: number
                  description: Accepted but not used; the session duration is the one sent to `/local-coop/login`, carried in `totpToken`
      responses:
        '200':
          description: P2 session created
          headers:
            Set-Cookie:
              description: httpOnly localCoopP2 cookie (path /api/local-coop)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalCoopSession'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or 2FA is not configured on this server (`TOTP_NOT_CONFIGURED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: P1 not authenticated, challenge token invalid, expired or issued to another P1 (`INVALID_TOKEN`), or wrong code (`INVALID_TOTP_CODE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: P2 account deleted, deactivated or with an unverified email (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (`RATE_LIMITED`), or 10 wrong codes for P2's account within 15 minutes (`TOTP_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /local-coop/session:
    get:
      tags: [Local Co-Op]
      summary: Get current local co-op P2 session
      operationId: localCoopSession
      security: []
      responses:
        '200':
          description: Active P2 session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalCoopSession'
        '401':
          description: No session cookie, invalid or expired session, or the P2 account was deleted or deactivated (the cookie is then cleared)
          content:
