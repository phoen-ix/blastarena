      type: object
      description: Filter for bulk account cleanup. Only accounts with the `user` role are ever matched.
      required: [type]
      properties:
        type:
          type: string
          enum: [unverified, inactive, deactivated]
          description: |
            `unverified`: email not verified and account created more than `days` days ago.
            `inactive`: last login more than `days` days ago (or never logged in and created more than `days` days ago).
            `deactivated`: deactivated accounts; `days` is ignored.
        days:
          type: integer
          minimum: 1
          description: Required for `unverified` and `inactive`

