      security: []
      operationId: getOpenWorldStatus
      responses:
        '200':
          description: Open world status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  playerCount:
                    type: integer
                  maxPlayers:
                    type: integer
                  roundTimeRemaining:
                    type: number
                    description: Seconds left in the current round
                  roundNumber:
                    type: integer
                  guestAccess:
                    type: boolean
                  leaderboard:
                    type: array
                    description: Every player in the open world, sorted by score, then kills
                    items:
                      type: object
                      properties:
                        playerId:
                          type: integer
                          description: Negative for guests
                        username:
                          type: string
                        kills:
                          type: integer
                        deaths:
                          type: integer
                        score:
                          type: integer
                        isGuest:
                          type: boolean

