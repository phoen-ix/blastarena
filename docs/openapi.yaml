components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token passed in Authorization header
    CookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: httpOnly refresh token cookie (set by login/refresh endpoints)

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: |
        Missing access token (`UNAUTHORIZED`), invalid or expired access token (`INVALID_TOKEN`),
        or, on routes that also check the verified email or the staff role against the database,
        a token whose user no longer exists (`USER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role not allowed (`FORBIDDEN`) or account deactivated (`DEACTIVATED`); the role is read from the database, not the token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed (`VALIDATION_ERROR`); `details` lists each invalid field
      content:
        application/json:
          schema:
            type: object
            required: [error, code, details]
            properties:
              error:
                type: string
                example: Validation failed
              code:
                type: string
                enum: [VALIDATION_ERROR]
              details:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: Dotted path of the invalid field
                    message:
                      type: string
    RateLimited:
      description: Too many requests (`RATE_LIMITED`)
      headers:
        Retry-After:
          description: Seconds until the limit resets (not sent by the in-memory fallback used when Redis is unavailable)
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error:
                type: string
                example: Too many requests
              code:
                type: string
                enum: [RATE_LIMITED]
              retryAfter:
                type: integer
                description: Same value as the Retry-After header, when sent
    EmailNotVerified:
      description: Email address not verified (`EMAIL_NOT_VERIFIED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Success:
      description: Operation successful
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true

  schemas:
    # ---- Common ----
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code, where the server sets one; the values an operation can return are listed in its response descriptions
      required: [error]

    ErrorWithMessage:
      type: object
      properties:
        status:
          type: string
        message:
          type: string

    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]

    DbBoolean:
      type: integer
      enum: [0, 1]
      description: A MySQL BOOLEAN column passed through without conversion, so it arrives as 0 or 1 instead of false or true

    # ---- Enums ----
    UserRole:
      type: string
      enum: [user, moderator, admin]

    GameMode:
      type: string
      enum: [ffa, teams, battle_royale, sudden_death, deathmatch, king_of_the_hill]

    PowerUpType:
      type: string
      enum: [bomb_up, fire_up, speed_up, shield, kick, pierce_bomb, remote_bomb, line_bomb, bomb_throw]

    BotDifficulty:
      type: string
      enum: [easy, normal, hard]

    # ---- Auth ----
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_-]+$'
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        accessToken:
          type: string

    PublicUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        language:
          type: string
          description: Preferred language code, `en` unless changed (see `/user/language` for the supported values)
        emailVerified:
          type: boolean
        twoFactorEnabled:
          type: boolean

    TotpChallengeResponse:
      type: object
      description: Returned instead of a session when the account has 2FA enabled
      required: [totpRequired, totpToken]
      properties:
        totpRequired:
          type: boolean
          enum: [true]
        totpToken:
          type: string
          description: Challenge token for the matching verify-totp endpoint, valid for 5 minutes

    # ---- User ----
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        emailHint:
          type: string
          description: Masked email address (e.g. `j***@e***.com`)
        role:
          $ref: '#/components/schemas/UserRole'
        emailVerified:
          type: boolean
        twoFactorEnabled:
          type: boolean
        pendingEmailHint:
          type: string
          nullable: true
          description: Masked address of a pending email change
        createdAt:
          type: string
          format: date-time
        stats:
          type: object
          description: Missing values default to 0 (Elo and peak Elo to 1000, level to 1)
          properties:
            totalMatches:
              type: integer
            totalWins:
              type: integer
            totalKills:
              type: integer
            totalDeaths:
              type: integer
            totalBombs:
              type: integer
            totalPowerups:
              type: integer
            totalPlaytime:
              type: integer
            winStreak:
              type: integer
            bestWinStreak:
              type: integer
            eloRating:
              type: integer
            peakElo:
              type: integer
            totalXp:
              type: integer
            level:
              type: integer
        isProfilePublic:
          type: boolean
        acceptFriendRequests:
          type: boolean

    # ---- Lobby ----
    RoomListItem:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        host:
          type: string
        playerCount:
          type: integer
        maxPlayers:
          type: integer
        gameMode:
          $ref: '#/components/schemas/GameMode'
        status:
          type: string
          enum: [waiting, playing]
        customMapName:
          type: string
          description: Present only when the room plays a custom map

    # ---- Campaign ----
    CampaignWorld:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
        theme:
          type: string
        isPublished:
          type: boolean
        levelCount:
          type: integer
          description: Published levels for players; all levels in the admin list
        completedCount:
          type: integer
          description: Levels the current user completed (player list only)

    CampaignWorldWithLevels:
      allOf:
        - $ref: '#/components/schemas/CampaignWorld'
        - type: object
          properties:
            levels:
              type: array
              items:
                $ref: '#/components/schemas/CampaignLevelSummary'

    CampaignLevelSummary:
      type: object
      properties:
        id:
          type: integer
        worldId:
          type: integer
        name:
          type: string
        description:
          type: string
        sortOrder:
          type: integer
        mapWidth:
          type: integer
        mapHeight:
          type: integer
        winCondition:
          $ref: '#/components/schemas/CampaignWinCondition'
        lives:
          type: integer
        timeLimit:
          type: integer
        parTime:
          type: integer
        enemyCount:
          type: integer
        isPublished:
          type: boolean
        progress:
          $ref: '#/components/schemas/LevelProgress'

    CampaignLevel:
      allOf:
        - type: object
          properties:
            id:
              type: integer
            worldId:
              type: integer
            sortOrder:
              type: integer
            isPublished:
              type: boolean
        - $ref: '#/components/schemas/CampaignLevelContent'

    CampaignLevelContent:
      type: object
      description: A level's content, i.e. everything but its database fields (id, worldId, sortOrder, isPublished)
      properties:
        name:
          type: string
        description:
          type: string
        mapWidth:
          type: integer
        mapHeight:
          type: integer
        tiles:
          type: array
          items:
            type: array
            items:
              type: string
        fillMode:
          type: string
          enum: [handcrafted, hybrid]
        wallDensity:
          type: number
        playerSpawns:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        enemyPlacements:
          type: array
          items:
            $ref: '#/components/schemas/EnemyPlacement'
        powerupPlacements:
          type: array
          items:
            $ref: '#/components/schemas/PowerUpPlacement'
        winCondition:
          $ref: '#/components/schemas/CampaignWinCondition'
        winConditionConfig:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/WinConditionConfig'
        lives:
          type: integer
        timeLimit:
          type: integer
        parTime:
          type: integer
          description: Seconds; 0 means no par time
        carryOverPowerups:
          type: boolean
        startingPowerups:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StartingPowerUps'
        availablePowerupTypes:
          type: array
          items:
            $ref: '#/components/schemas/PowerUpType'
          nullable: true
        powerupDropRate:
          type: number
        reinforcedWalls:
          type: boolean
        hazardTiles:
          type: boolean
        coveredTiles:
          type: array
          items:
            type: object
            properties:
              x:
                type: integer
              y:
                type: integer
              type:
                type: string
        puzzleConfig:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PuzzleConfig'

    WinConditionConfig:
      type: object
      properties:
        exitPosition:
          $ref: '#/components/schemas/Position'
        goalPosition:
          $ref: '#/components/schemas/Position'
        surviveTimeTicks:
          type: integer
        killTarget:
          type: integer

    StartingPowerUps:
      type: object
      properties:
        bombUp:
          type: integer
        fireUp:
          type: integer
        speedUp:
          type: integer
        shield:
          type: boolean
        kick:
          type: boolean
        pierceBomb:
          type: boolean
        remoteBomb:
          type: boolean
        lineBomb:
          type: boolean
        bombThrow:
          type: boolean

    PuzzleConfig:
      type: object
      properties:
        switchVariants:
          type: object
          description: Switch variant by "x,y" position; switches not listed are toggles
          additionalProperties:
            type: string
            enum: [toggle, pressure, oneshot]

    CampaignWinCondition:
      type: string
      enum: [kill_all, find_exit, reach_goal, survive_time]

    LevelProgress:
      type: object
      properties:
        levelId:
          type: integer
        completed:
          type: boolean
        bestTimeSeconds:
          type: number
          nullable: true
        stars:
          type: integer
        attempts:
          type: integer

    CampaignUserState:
      type: object
      properties:
        currentWorldId:
          type: integer
          nullable: true
        currentLevelId:
          type: integer
          nullable: true
        carriedPowerups:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StartingPowerUps'
        totalLevelsCompleted:
          type: integer
        totalStars:
          type: integer

    Position:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
        y:
          type: integer

    EnemyPlacement:
      type: object
      required: [enemyTypeId, x, y]
      properties:
        enemyTypeId:
          type: integer
        x:
          type: integer
        y:
          type: integer
        patrolPath:
          type: array
          items:
            $ref: '#/components/schemas/Position'

    PowerUpPlacement:
      type: object
      required: [type, x, y, hidden]
      properties:
        type:
          $ref: '#/components/schemas/PowerUpType'
        x:
          type: integer
        y:
          type: integer
        hidden:
          type: boolean

    EnemyTypeEntry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        config:
          $ref: '#/components/schemas/EnemyTypeConfig'
        isBoss:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EnemyTypeConfig:
      type: object
      required: [speed, movementPattern, canPassWalls, canPassBombs, canBomb, hp, contactDamage, sprite, dropChance, dropTable, isBoss, sizeMultiplier]
      properties:
        speed:
          type: number
          minimum: 0.1
          maximum: 5
        movementPattern:
          type: string
          enum: [random_walk, chase_player, patrol_path, wall_follow, stationary]
        canPassWalls:
          type: boolean
        canPassBombs:
          type: boolean
        canBomb:
          type: boolean
        bombConfig:
          $ref: '#/components/schemas/EnemyBombConfig'
        hp:
          type: integer
          minimum: 1
          maximum: 100
        contactDamage:
          type: boolean
        sprite:
          $ref: '#/components/schemas/EnemySpriteConfig'
        dropChance:
          type: number
          minimum: 0
          maximum: 1
        dropTable:
          type: array
          items:
            type: string
        isBoss:
          type: boolean
        sizeMultiplier:
          type: number
          minimum: 1
          maximum: 3
        bossPhases:
          type: array
          items:
            $ref: '#/components/schemas/BossPhaseConfig'
        enemyAiId:
          type: string
          format: uuid
          description: Custom enemy AI to drive this enemy
        difficulty:
          type: string
          enum: [easy, normal, hard]

    EnemyBombConfig:
      type: object
      required: [fireRange, cooldownTicks, trigger]
      properties:
        fireRange:
          type: integer
          minimum: 1
          maximum: 8
        cooldownTicks:
          type: integer
          minimum: 10
          maximum: 200
        trigger:
          type: string
          enum: [timer, proximity, random]
        proximityRange:
          type: integer
          minimum: 1
          maximum: 20

    EnemySpriteConfig:
      type: object
      required: [bodyShape, primaryColor, secondaryColor, eyeStyle, hasTeeth, hasHorns]
      properties:
        bodyShape:
          type: string
          enum: [blob, spiky, ghost, robot, bug, skull]
        primaryColor:
          type: string
        secondaryColor:
          type: string
        eyeStyle:
          type: string
          enum: [round, angry, sleepy, crazy]
        hasTeeth:
          type: boolean
        hasHorns:
          type: boolean
        hasTail:
          type: boolean
          default: false
        hasAura:
          type: boolean
          default: false
        hasCrown:
          type: boolean
          default: false
        hasScar:
          type: boolean
          default: false
        hasWings:
          type: boolean
          default: false
        accessory:
          type: string
          enum: [none, bow_tie, monocle, bandana]
          default: none

    BossPhaseConfig:
      type: object
      required: [hpThreshold]
      properties:
        hpThreshold:
          type: number
          minimum: 0
          maximum: 1
        speedMultiplier:
          type: number
          minimum: 0.01
        movementPattern:
          type: string
          enum: [random_walk, chase_player, patrol_path, wall_follow, stationary]
        canBomb:
          type: boolean
        bombConfig:
          $ref: '#/components/schemas/EnemyBombConfig'
        spawnEnemies:
          type: array
          items:
            type: object
            required: [enemyTypeId, count]
            properties:
              enemyTypeId:
                type: integer
              count:
                type: integer
                minimum: 1
                maximum: 10

    EnemyTypeInput:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
          default: ''
        config:
          $ref: '#/components/schemas/EnemyTypeConfig'

    LevelInput:
      type: object
      description: Every field is optional; on update only the fields sent change.
      properties:
        worldId:
          type: integer
          description: Needed on create (or as the `worldId` query parameter); ignored on update
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        mapWidth:
          type: integer
          minimum: 7
          maximum: 51
        mapHeight:
          type: integer
          minimum: 7
          maximum: 51
        tiles:
          type: array
          items:
            type: array
            items:
              type: string
        fillMode:
          type: string
          enum: [handcrafted, hybrid]
        wallDensity:
          type: number
          minimum: 0.1
          maximum: 0.9
        playerSpawns:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        enemyPlacements:
          type: array
          items:
            $ref: '#/components/schemas/EnemyPlacement'
        powerupPlacements:
          type: array
          items:
            $ref: '#/components/schemas/PowerUpPlacement'
        winCondition:
          $ref: '#/components/schemas/CampaignWinCondition'
        winConditionConfig:
          $ref: '#/components/schemas/WinConditionConfig'
        lives:
          type: integer
          minimum: 1
          maximum: 99
        timeLimit:
          type: integer
          minimum: 0
          maximum: 3600
        parTime:
          type: integer
          minimum: 0
          maximum: 3600
        carryOverPowerups:
          type: boolean
        startingPowerups:
          $ref: '#/components/schemas/StartingPowerUps'
        availablePowerupTypes:
          type: array
          items:
            type: string
        powerupDropRate:
          type: number
          minimum: 0
          maximum: 1
        reinforcedWalls:
          type: boolean
        hazardTiles:
          type: boolean
        coveredTiles:
          type: array
          items:
            type: object
            required: [x, y, type]
            properties:
              x:
                type: integer
              y:
                type: integer
              type:
                type: string
        puzzleConfig:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PuzzleConfig'
        isPublished:
          type: boolean

    LevelExportData:
      allOf:
        - type: object
          properties:
            _format:
              type: string
              enum: [blast-arena-level]
            _version:
              type: integer
              enum: [1]
        - $ref: '#/components/schemas/CampaignLevelContent'

    LevelBundleExportData:
      type: object
      properties:
        _format:
          type: string
          enum: [blast-arena-level-bundle]
        _version:
          type: integer
          enum: [2]
        level:
          $ref: '#/components/schemas/CampaignLevelContent'
        enemyTypes:
          type: array
          description: The enemy types the level's placements reference
          items:
            $ref: '#/components/schemas/BundledEnemyType'

    BundledEnemyType:
      type: object
      properties:
        originalId:
          type: integer
        name:
          type: string
        description:
          type: string
        config:
          $ref: '#/components/schemas/EnemyTypeConfig'
        enemyAiSource:
          type: string
          description: TypeScript source of the custom enemy AI in `config.enemyAiId`, when it can be read
        enemyAiName:
          type: string

    EnemyTypeExportData:
      type: object
      properties:
        _format:
          type: string
          enum: [blast-arena-enemy-type]
        _version:
          type: integer
          enum: [2]
        name:
          type: string
        description:
          type: string
        config:
          $ref: '#/components/schemas/EnemyTypeConfig'
        enemyAiSource:
          type: string
          description: TypeScript source of the custom enemy AI in `config.enemyAiId`, when it can be read
        enemyAiName:
          type: string

    ImportConflict:
      type: object
      properties:
        originalId:
          type: integer
        name:
          type: string
        existingId:
          type: integer
        existingName:
          type: string

    SortOrderRequest:
      type: object
      required: [sortOrder]
      properties:
        sortOrder:
          type: integer
          minimum: 0

    # ---- Settings ----
    GameDefaults:
      type: object
      properties:
        gameMode:
          $ref: '#/components/schemas/GameMode'
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 8
        roundTime:
          type: integer
          minimum: 30
          maximum: 600
        mapWidth:
          type: integer
          minimum: 11
          maximum: 51
        wallDensity:
          type: number
          minimum: 0
          maximum: 1
        powerUpDropRate:
          type: number
          minimum: 0
          maximum: 1
        botCount:
          type: integer
          minimum: 0
          maximum: 7
        botDifficulty:
          $ref: '#/components/schemas/BotDifficulty'
        reinforcedWalls:
          type: boolean
        enableMapEvents:
          type: boolean
        hazardTiles:
          type: boolean
        friendlyFire:
          type: boolean
