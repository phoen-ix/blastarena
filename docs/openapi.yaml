  # ===================== Session Revocation =====================
  /admin/users/{id}/revoke-sessions:
    post:
      tags: [Users Admin]
      summary: Revoke all sessions for a user (admin only)
      description: Revokes refresh tokens and force-disconnects the user's sockets.
      operationId: adminRevokeUserSessions
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid user ID, or revoking your own sessions (`SELF_ACTION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/revoke-all-sessions:
    post:
      tags: [Users Admin]
      summary: Revoke all user sessions globally (admin only)
      description: Revokes all refresh tokens and disconnects all sockets except the admin performing the action.
      operationId: adminRevokeAllSessions
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

