        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Settings]
      summary: Update open world settings (admin only)
      description: |
        Partial update: only the fields sent are stored. The running open world is hot-reloaded.
        Enabling it while disabled starts a new round and disabling it shuts it down; otherwise the
        new settings are adopted, and `roundTime` and `respawnDelay` also apply to the round in
        progress.
      operationId: adminSetOpenWorldSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWorldSettings'
      responses:
        '200':
