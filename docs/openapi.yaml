  # ===================== Challenges =====================
  /challenges/active:
    get:
      tags: [Challenges]
      summary: Get the active map challenge
      description: |
        The active challenge with its map tiles and the top 5 scores. When no challenge is active,
        or challenges are turned off (`/admin/settings/challenges_enabled`), the body is only
        `{ "challenge": null }`.
      security: []
      operationId: getActiveChallenge
      responses:
        '200':
          description: Active challenge, or a null challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/MapChallengeSummary'
                  mapTiles:
                    type: array
                    nullable: true
                    description: Tile grid of the challenge map (rows of tile type names)
                    items:
                      type: array
                      items:
                        type: string
                  topScores:
                    type: array
                    maxItems: 5
                    description: Ordered by wins, then kills, then fewest deaths
                    items:
                      type: object
                      properties:
                        userId:
                          type: integer
                        username:
                          type: string
                        wins:
                          type: integer
                        kills:
                          type: integer
                        deaths:
                          type: integer
                        gamesPlayed:
                          type: integer
                        bestPlacement:
                          type: integer
                          nullable: true

  /admin/challenges:
    get:
      tags: [Challenges]
      summary: List map challenges (admin only)
      description: Ordered by start date, newest first.
      operationId: adminListChallenges
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Paginated challenge list
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenges:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapChallengeSummary'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Challenges]
      summary: Create a map challenge (admin only)
      description: The challenge is created inactive; see `/admin/challenges/{id}/activate`.
      operationId: adminCreateChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, customMapId, gameMode, startDate, endDate]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 150
                description:
                  type: string
                  maxLength: 2000
                  default: ''
                customMapId:
                  type: integer
                  minimum: 1
                  description: Must be an existing, published custom map
                gameMode:
                  $ref: '#/components/schemas/GameMode'
                startDate:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                endDate:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  description: Must be after `startDate`
      responses:
        '200':
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  description:
                    type: string
                  customMapId:
                    type: integer
                  gameMode:
                    $ref: '#/components/schemas/GameMode'
                  startDate:
                    type: string
                    format: date
                  endDate:
                    type: string
                    format: date
                  isActive:
                    type: boolean
                    description: Always false for a new challenge
                  createdBy:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Validation failed (`VALIDATION_ERROR`), `endDate` not after `startDate` (`INVALID_DATE_RANGE`), unknown map (`MAP_NOT_FOUND`), or map not published (`MAP_NOT_PUBLISHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/challenges/{id}:
    put:
      tags: [Challenges]
      summary: Update a map challenge (admin only)
      description: |
        Updates only the fields sent. When `startDate` or `endDate` is sent, the range is re-checked
        against the stored value of the other end, so `endDate` must still be after `startDate`.
        A new `customMapId` must be an existing, published custom map.
      operationId: adminUpdateChallenge
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 150
                description:
                  type: string
                  maxLength: 2000
                customMapId:
                  type: integer
                  minimum: 1
                  description: Must be an existing, published custom map
                gameMode:
                  $ref: '#/components/schemas/GameMode'
                startDate:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                endDate:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Challenge updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid ID (`INVALID_ID`), validation failed (`VALIDATION_ERROR`), `endDate` not after `startDate` (`INVALID_DATE_RANGE`), unknown map (`MAP_NOT_FOUND`), or map not published (`MAP_NOT_PUBLISHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Challenge not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Challenges]
      summary: Delete a map challenge (admin only)
      description: The challenge's scores are removed with it (foreign-key cascade).
      operationId: adminDeleteChallenge
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Challenge deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid ID (`INVALID_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Challenge not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/challenges/{id}/activate:
    post:
      tags: [Challenges]
      summary: Activate a map challenge (admin only)
      description: |
        In one transaction every challenge is set inactive and then this one active, so at most one
        challenge is active at a time. An unknown ID is rejected before anything is changed.
      operationId: adminActivateChallenge
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Challenge activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid ID (`INVALID_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Challenge not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/challenges/{id}/deactivate:
    post:
      tags: [Challenges]
      summary: Deactivate a map challenge (admin only)
      operationId: adminDeactivateChallenge
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Challenge deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid ID (`INVALID_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Challenge not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

