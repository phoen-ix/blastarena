    CosmeticType:
      type: string
      enum: [color, eyes, trail, bomb_skin]

    CosmeticRarity:
      type: string
      enum: [common, rare, epic, legendary]

    CosmeticUnlockType:
      type: string
      enum: [achievement, campaign_stars, level_milestone, default]

    AchievementConditionType:
      type: string
      enum: [cumulative, per_game, mode_specific, campaign]

    AchievementRewardType:
      type: string
      enum: [cosmetic, title, none]

    ActivityStatus:
      type: string
      enum: [offline, online, in_lobby, in_game, in_campaign]

    # ---- Local Co-Op ----
    LocalCoopLoginRequest:
      type: object
      required: [username, password, duration]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 20
        password:
          type: string
          minLength: 1
          maxLength: 128
        duration:
          type: integer
          description: Session duration in hours (0 = session-only cookie)
          enum: [0, 1, 6, 12, 24]

    LocalCoopSession:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
        cosmetics:
          $ref: '#/components/schemas/PlayerCosmeticData'

    PlayerCosmeticData:
      type: object
      description: Rendering data for a player's equipped, active cosmetics. Empty slots are omitted, and where nothing is equipped a public profile omits the whole object while a local co-op session sends an empty one.
      properties:
        colorHex:
          type: integer
          description: Player colour as a 24-bit RGB number
        eyeStyle:
          type: string
        trailConfig:
          type: object
          properties:
            particleKey:
              type: string
            tint:
              type: integer
            frequency:
              type: number
        bombSkinConfig:
          type: object
          properties:
            baseColor:
              type: integer
            fuseColor:
              type: integer
            label:
              type: string

    # ---- User (new) ----
    PrivacySettings:
      type: object
      properties:
        isProfilePublic:
          type: boolean
        acceptFriendRequests:
          type: boolean

    BuddySettings:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 20
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Hex color code
        size:
          type: number
          minimum: 0.4
          maximum: 0.8

    # ---- Leaderboard ----
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        userId:
          type: integer
        username:
          type: string
        eloRating:
          type: integer
        peakElo:
          type: integer
        matchesPlayed:
          type: integer
        totalWins:
          type: integer
        totalKills:
          type: integer
        level:
          type: integer
        totalXp:
          type: integer
        rankTier:
          type: string
        rankColor:
          type: string

    LeaderboardResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        season:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Season'

    Season:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isActive:
          type: boolean

    RankTier:
      type: object
      required: [name, minElo, maxElo, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        minElo:
          type: integer
        maxElo:
          type: integer
          description: Must not be below minElo
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{3,8}$'

    RankConfig:
      type: object
      required: [tiers, subTiersEnabled]
      properties:
        tiers:
          type: array
          minItems: 1
          description: Must tile the Elo range without gaps or overlaps (each minElo is the previous tier's maxElo + 1)
          items:
            $ref: '#/components/schemas/RankTier'
        subTiersEnabled:
          type: boolean

    SeasonSummary:
      type: object
      properties:
        seasonId:
          type: integer
        seasonName:
          type: string
        finalElo:
          type: integer
        peakElo:
          type: integer
        matchesPlayed:
          type: integer

    UserAchievementPublic:
      type: object
      properties:
        achievement:
          $ref: '#/components/schemas/AchievementEntry'
        unlockedAt:
          type: string
          format: date-time

    PublicProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        stats:
          type: object
          properties:
            totalMatches:
              type: integer
            totalWins:
              type: integer
            totalKills:
              type: integer
            totalDeaths:
              type: integer
            eloRating:
              type: integer
            peakElo:
              type: integer
            winStreak:
              type: integer
            bestWinStreak:
              type: integer
            level:
              type: integer
            totalXp:
              type: integer
            totalPlaytime:
              type: integer
              description: Seconds played in matches
        rankTier:
          type: string
        rankColor:
          type: string
        seasonHistory:
          type: array
          items:
            $ref: '#/components/schemas/SeasonSummary'
        achievements:
          type: array
          items:
            $ref: '#/components/schemas/UserAchievementPublic'
        equippedCosmetics:
          $ref: '#/components/schemas/EquippedCosmetics'
        cosmeticData:
          $ref: '#/components/schemas/PlayerCosmeticData'

    UserRankInfo:
      type: object
      properties:
        eloRating:
          type: integer
        peakElo:
          type: integer
        rankTier:
          type: string
        rankColor:
          type: string
        seasonElo:
          type: integer
          nullable: true
        level:
          type: integer
        totalXp:
          type: integer

    # ---- Friends ----
    FriendEntry:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        status:
          type: string
          enum: [pending, accepted]
        direction:
          type: string
          nullable: true
          enum: [incoming, outgoing, null]
        activity:
          $ref: '#/components/schemas/ActivityStatus'
        roomCode:
          type: string
        gameMode:
          type: string
        since:
          type: string
          format: date-time

    FriendRequest:
      type: object
      description: "`id` and `fromUserId` are both the other user's ID. In `outgoing` requests, `fromUserId` and `fromUsername` are the recipient."
      properties:
        id:
          type: integer
        fromUserId:
          type: integer
        fromUsername:
          type: string
        createdAt:
          type: string
          format: date-time

    BlockedUser:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string

    # ---- Messages ----
    ConversationListItem:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        lastMessage:
          type: string
        lastMessageAt:
          type: string
          format: date-time
        unreadCount:
          type: integer

    ConversationMessage:
      type: object
      properties:
        id:
          type: integer
        senderId:
          type: integer
        senderUsername:
          type: string
        recipientId:
          type: integer
        message:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ---- Cosmetics ----
    CosmeticEntry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          $ref: '#/components/schemas/CosmeticType'
        config:
          type: object
          additionalProperties: true
        rarity:
          $ref: '#/components/schemas/CosmeticRarity'
        unlockType:
          $ref: '#/components/schemas/CosmeticUnlockType'
        unlockRequirement:
          type: object
          nullable: true
          additionalProperties: true
        isActive:
          type: boolean
        sortOrder:
          type: integer

    EquippedCosmetics:
      type: object
      properties:
        colorId:
          type: integer
          nullable: true
        eyesId:
          type: integer
          nullable: true
        trailId:
          type: integer
          nullable: true
        bombSkinId:
          type: integer
          nullable: true

    # ---- Achievements ----
    AchievementEntry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
        conditionType:
          $ref: '#/components/schemas/AchievementConditionType'
        conditionConfig:
          type: object
          additionalProperties: true
        rewardType:
          $ref: '#/components/schemas/AchievementRewardType'
        rewardId:
          type: integer
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer

    UserAchievement:
      type: object
      properties:
        achievementId:
          type: integer
        unlockedAt:
          type: string
          format: date-time
          nullable: true
        progress:
          type: object
          nullable: true
          additionalProperties: true

    AchievementProgress:
      type: object
      properties:
        achievementId:
          type: integer
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
        conditionType:
          $ref: '#/components/schemas/AchievementConditionType'
        current:
          type: integer
          description: Current progress value
        threshold:
          type: integer
          description: Target value to unlock
        unlocked:
          type: boolean
        unlockedAt:
          type: string
          format: date-time
          nullable: true

    # ---- Custom Maps ----
    CustomMap:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        mapWidth:
          type: integer
        mapHeight:
          type: integer
        tiles:
          type: array
          items:
            type: array
            items:
              type: string
        spawnPoints:
          type: array
          items:
            type: object
            properties:
              x:
                type: integer
              y:
                type: integer
        isPublished:
          type: boolean
        createdBy:
          type: integer
        creatorUsername:
          type: string
        playCount:
          type: integer

    CustomMapSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        mapWidth:
          type: integer
        mapHeight:
          type: integer
        spawnCount:
          type: integer
        isPublished:
          type: boolean
        createdBy:
          type: integer
        creatorUsername:
          type: string
        playCount:
          type: integer
        avgRating:
          type: number
          nullable: true
          description: Average star rating, null if unrated. `/maps/mine` does not load ratings, so it is always null there.
        ratingCount:
          type: integer
          description: Number of ratings (always 0 in `/maps/mine`)

    CustomMapInput:
      type: object
      required: [name, mapWidth, mapHeight, tiles, spawnPoints]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
          default: ''
        mapWidth:
          type: integer
          minimum: 9
          maximum: 51
          description: Must be an odd number
        mapHeight:
          type: integer
          minimum: 9
          maximum: 51
          description: Must be an odd number
        tiles:
          type: array
          items:
            type: array
            items:
              type: string
        spawnPoints:
          type: array
          items:
            type: object
            required: [x, y]
            properties:
              x:
                type: integer
              y:
                type: integer
          minItems: 2
          maxItems: 8
        isPublished:
          type: boolean
          default: false

    # ---- Challenges ----
    MapChallengeSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        customMapId:
          type: integer
        mapName:
          type: string
        mapCreator:
          type: string
          description: Username of the map's creator
        gameMode:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isActive:
          type: boolean

    # ---- Campaign Replays ----
    CampaignReplayListItem:
      type: object
      properties:
        sessionId:
          type: string
        levelId:
          type: integer
        levelName:
          type: string
        worldName:
          type: string
        userId:
          type: integer
        username:
          type: string
        coopMode:
          type: boolean
        buddyMode:
          type: boolean
        duration:
          type: number
          description: Duration in seconds
        result:
          type: string
          enum: [completed, failed]
        stars:
          type: integer
          minimum: 0
          maximum: 3
        createdAt:
          type: string
          format: date-time
        fileSizeKB:
          type: integer

    # ---- Achievement Admin ----
    AchievementInput:
      type: object
      required: [name, description, conditionType, conditionConfig]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        icon:
          type: string
          maxLength: 10
        category:
          type: string
          maxLength: 50
        conditionType:
          $ref: '#/components/schemas/AchievementConditionType'
        conditionConfig:
          type: object
          additionalProperties: true
        rewardType:
          $ref: '#/components/schemas/AchievementRewardType'
        rewardId:
          type: integer
          nullable: true
        sortOrder:
          type: integer

    AchievementUpdateInput:
      type: object
      description: Every field is optional; only the fields sent change
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
        icon:
          type: string
          maxLength: 10
        category:
          type: string
          maxLength: 50
        conditionType:
          $ref: '#/components/schemas/AchievementConditionType'
        conditionConfig:
          type: object
          additionalProperties: true
        rewardType:
          $ref: '#/components/schemas/AchievementRewardType'
        rewardId:
          type: integer
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer

    AchievementExportData:
      type: object
      properties:
        _format:
          type: string
          enum: [blast-arena-achievement]
        _version:
          type: integer
          enum: [1]
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
        conditionType:
          $ref: '#/components/schemas/AchievementConditionType'
        conditionConfig:
          type: object
          additionalProperties: true
        rewardType:
          $ref: '#/components/schemas/AchievementRewardType'
        reward:
          $ref: '#/components/schemas/CosmeticExportEntry'
        sortOrder:
          type: integer

    AchievementExportEntry:
      type: object
      description: Achievement data without format/version headers (used in bundle and import)
      properties:
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          type: string
        conditionType:
          $ref: '#/components/schemas/AchievementConditionType'
        conditionConfig:
          type: object
          additionalProperties: true
        rewardType:
          $ref: '#/components/schemas/AchievementRewardType'
        reward:
          $ref: '#/components/schemas/CosmeticExportEntry'
        sortOrder:
          type: integer

    AchievementBundleExportData:
      type: object
      properties:
        _format:
          type: string
          enum: [blast-arena-achievement-bundle]
        _version:
          type: integer
          enum: [1]
        achievements:
          type: array
          items:
            $ref: '#/components/schemas/AchievementExportEntry'
        cosmetics:
          type: array
          items:
            $ref: '#/components/schemas/CosmeticBundleEntry'

    AchievementImportConflict:
      type: object
      properties:
        originalCosmeticId:
          type: integer
        cosmeticName:
          type: string
        existingId:
          type: integer
        existingName:
          type: string

    CosmeticBundleEntry:
      type: object
      properties:
        originalId:
          type: integer
        data:
          $ref: '#/components/schemas/CosmeticExportEntry'

    # ---- Cosmetic Admin ----
    CosmeticInput:
      type: object
      required: [name, type, config]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CosmeticType'
        config:
          type: object
          additionalProperties: true
        rarity:
          $ref: '#/components/schemas/CosmeticRarity'
        unlockType:
          $ref: '#/components/schemas/CosmeticUnlockType'
        unlockRequirement:
          type: object
          nullable: true
          additionalProperties: true
        sortOrder:
          type: integer

    CosmeticUpdateInput:
      type: object
      description: Every field is optional; only the fields sent change
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CosmeticType'
        config:
          type: object
          additionalProperties: true
        rarity:
          $ref: '#/components/schemas/CosmeticRarity'
        unlockType:
          $ref: '#/components/schemas/CosmeticUnlockType'
        unlockRequirement:
          type: object
          nullable: true
          additionalProperties: true
        isActive:
          type: boolean
        sortOrder:
          type: integer

    CosmeticExportData:
      type: object
      properties:
        _format:
          type: string
          enum: [blast-arena-cosmetic]
        _version:
          type: integer
          enum: [1]
        name:
          type: string
        type:
          $ref: '#/components/schemas/CosmeticType'
        config:
          type: object
          additionalProperties: true
        rarity:
          $ref: '#/components/schemas/CosmeticRarity'
        unlockType:
          $ref: '#/components/schemas/CosmeticUnlockType'
        unlockRequirement:
          type: object
          nullable: true
          additionalProperties: true
        sortOrder:
          type: integer

    CosmeticExportEntry:
      type: object
      nullable: true
      description: Cosmetic data without format/version headers (used in achievement rewards)
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/CosmeticType'
        config:
          type: object
          additionalProperties: true
        rarity:
          $ref: '#/components/schemas/CosmeticRarity'
        unlockType:
          $ref: '#/components/schemas/CosmeticUnlockType'
        unlockRequirement:
          type: object
          nullable: true
          additionalProperties: true
        sortOrder:
          type: integer
