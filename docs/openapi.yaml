openapi: 3.0.3
info:
  title: BlastArena API
  version: 1.0.0
  description: |
    REST API for BlastArena, a multiplayer online grid-based explosive arena game.
    All endpoints are mounted under the `/api` prefix.
    Authentication uses JWT Bearer tokens (access token) and httpOnly cookies (refresh token).

servers:
  - url: /api
    description: API base path

tags:
  - name: Health
    description: Service health check
  - name: Auth
    description: Authentication (register, login, logout, token refresh, email verification, password reset)
  - name: User
    description: User profile and account management
  - name: Lobby
    description: Game room listing and creation
  - name: Campaign
    description: Player-facing campaign endpoints (worlds, levels, progress, enemy types)
  - name: Campaign Admin
    description: Admin campaign management (worlds, levels, enemy types, import/export)
  - name: Settings
    description: Application settings (public reads, admin writes)
  - name: Users Admin
    description: Admin user management
  - name: Matches
    description: Match history and management
  - name: Rooms
    description: Active room listing (admin/staff)
  - name: Audit Log
    description: Admin action audit log
  - name: Announcements
    description: Toast and banner announcements
  - name: Replays
    description: Game replay management
  - name: Simulations
    description: Bot simulation batch management
  - name: Bot AI
    description: Custom bot AI upload and management
  - name: Local Co-Op
    description: Local co-op player 2 session management
  - name: Leaderboard
    description: Public leaderboard, ranks, seasons, and player profiles
  - name: Friends
    description: Friend list, blocked users, and user search
  - name: Messages
    description: Direct message conversations
  - name: Cosmetics
    description: Player cosmetics and equipment
  - name: Achievements
    description: Achievement definitions and player progress
  - name: Custom Maps
    description: User-created map management
  - name: Challenges
    description: Community map challenges (public active challenge, admin management)
  - name: Docs
    description: Documentation file serving
  - name: Campaign Replays
    description: Campaign replay management (staff/admin)
  - name: Enemy AI
    description: Admin enemy AI management
  - name: Seasons
    description: Admin season management
  - name: Achievements Admin
    description: Admin achievement management and import/export
  - name: Cosmetics Admin
    description: Admin cosmetic management and import/export

security:
  - BearerAuth: []

paths:
  # ===================== Health =====================
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  buildId:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithMessage'

  # ===================== Auth =====================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        No session is issued; the email address must be verified before logging in. If the email is
        already registered the response is the same 200 (the owner gets a warning email instead).
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered, or the email was already registered (indistinguishable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  emailVerificationRequired:
                    type: boolean
                    enum: [true]
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or the username, password or email fails the shared validators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Registration disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already taken (`CONFLICT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with credentials
      description: |
        Returns access token in body and sets httpOnly refreshToken cookie. For an account with 2FA
        enabled it returns a `TotpChallengeResponse` instead (no cookie); finish the login with
        `/auth/verify-totp`.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful, or a 2FA challenge
          headers:
            Set-Cookie:
              description: httpOnly refreshToken cookie (not set for a 2FA challenge)
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/TotpChallengeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Unknown username or wrong password (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account deactivated (`DEACTIVATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/verify-totp:
    post:
      tags: [Auth]
      summary: Complete a two-factor login
      description: |
        Second step of the login for accounts with 2FA enabled. For those accounts `/auth/login`
        answers a `TotpChallengeResponse` instead of a session; this call exchanges its `totpToken`
        (valid for 5 minutes) and a TOTP code or unused backup code for the session. Returns the
        access token in the body and sets the httpOnly refreshToken cookie, like `/auth/login`.
        Rate limited to 10 requests per 15 minutes per IP.
      security: []
      operationId: verifyTotpLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totpToken, code]
              properties:
                totpToken:
                  type: string
                  description: Challenge token returned by `/auth/login`
                code:
                  type: string
                  minLength: 6
                  maxLength: 10
                  description: 6-digit TOTP code or a backup code (`xxxx-xxxx`)
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: httpOnly refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or 2FA is not configured on this server (`TOTP_NOT_CONFIGURED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Challenge token invalid, expired or not a login challenge (`INVALID_TOKEN`), wrong code (`INVALID_TOTP_CODE`), or account deleted or deactivated (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (`RATE_LIMITED`), or 10 wrong codes for this account within 15 minutes (`TOTP_RATE_LIMITED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (revoke refresh token)
      description: |
        Revokes the refresh token from the httpOnly refreshToken cookie, if one is sent, and clears
        the cookie. Needs no Authorization header, so it also works after the access token has expired.
      security: []
      operationId: logout
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              description: Clears the refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using cookie
      description: Uses the httpOnly refreshToken cookie. No Authorization header needed.
      security:
        - CookieAuth: []
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed
          headers:
            Set-Cookie:
              description: Updated httpOnly refreshToken cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: No refresh token cookie (`NO_REFRESH_TOKEN`), unknown token (`INVALID_TOKEN`), expired token (`TOKEN_EXPIRED`), or a revoked token, which then revokes all of the user's refresh tokens (`TOKEN_REUSE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account deactivated (`DEACTIVATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email address
      description: The link sent by email. On success the browser is redirected to `{APP_URL}?emailVerified=true`.
      security: []
      operationId: verifyEmail
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Email verified; redirect to the app with `?emailVerified=true`
        '400':
          description: Invalid or expired token (`INVALID_TOKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (if account exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or invalid or expired reset token (`INVALID_TOKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ===================== User =====================
  /user/profile:
    get:
      tags: [User]
      summary: Get current user profile
      operationId: getUserProfile
      responses:
        '200':
          description: User profile with stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [User]
      summary: Update user profile
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  pattern: '^[a-zA-Z0-9_-]+$'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or the username fails the shared validator (e.g. invalid characters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: User not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username taken (`CONFLICT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/email:
    post:
      tags: [User]
      summary: Change email address
      description: Admins get direct update; regular users receive a confirmation email.
      operationId: changeEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '200':
          description: Email updated or confirmation sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or the address fails the shared email validator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '409':
          description: Address already in use by another account (`CONFLICT`); only for admins, whose change is applied directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [User]
      summary: Cancel pending email change
      operationId: cancelEmailChange
      responses:
        '200':
          description: Pending change cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'

  /user/password:
    post:
      tags: [User]
      summary: Change password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 128
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Validation failed (`VALIDATION_ERROR`), or the new password is the same as the current one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required, or current password incorrect (`INVALID_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: User not found (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/confirm-email/{token}:
    get:
      tags: [User]
      summary: Confirm email change
      description: The link sent by email. On success the browser is redirected to `{APP_URL}?emailChanged=true`, like `/auth/verify-email`.
      security: []
      operationId: confirmEmailChange
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Email updated; redirect to the app with `?emailChanged=true`
        '400':
          description: Invalid token (`INVALID_TOKEN`) or expired link (`TOKEN_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The new address is already in use by another account (`CONFLICT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ===================== Lobby =====================
  /lobby/rooms:
    get:
      tags: [Lobby]
      summary: List active rooms
      operationId: listRooms
      responses:
        '200':
          description: Array of room list items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'

  # ===================== Campaign (Player) =====================
  /campaign/worlds:
    get:
      tags: [Campaign]
      summary: List published worlds with progress
      operationId: getCampaignWorlds
      responses:
        '200':
          description: Worlds with nested levels and user progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  worlds:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignWorldWithLevels'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'

  /campaign/worlds/{worldId}/levels:
    get:
      tags: [Campaign]
      summary: List published levels in a world
      operationId: getCampaignWorldLevels
      parameters:
        - name: worldId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Levels in world
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignLevelSummary'
        '400':
          description: Invalid worldId (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'

  /campaign/levels/{levelId}:
    get:
      tags: [Campaign]
      summary: Get full level data
      description: Returns published levels only.
      operationId: getCampaignLevel
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Full level data
          content:
            application/json:
              schema:
                type: object
                properties:
                  level:
                    $ref: '#/components/schemas/CampaignLevel'
        '400':
          description: Invalid levelId (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: Level not found or not published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /campaign/progress:
    get:
      tags: [Campaign]
      summary: Get user campaign state
      operationId: getCampaignProgress
      responses:
        '200':
          description: User campaign progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/CampaignUserState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'

  /campaign/enemy-types:
    get:
      tags: [Campaign]
      summary: List all enemy types
      operationId: getCampaignEnemyTypes
      responses:
        '200':
          description: All enemy types
          content:
            application/json:
              schema:
                type: object
                properties:
                  enemyTypes:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnemyTypeEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'

  # ===================== Campaign Admin =====================
  /admin/campaign/worlds:
    get:
      tags: [Campaign Admin]
      summary: List all worlds (including unpublished, admin only)
      operationId: adminListWorlds
      responses:
        '200':
          description: All worlds
          content:
            application/json:
              schema:
                type: object
                properties:
                  worlds:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignWorld'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Campaign Admin]
      summary: Create a world (admin only)
      operationId: adminCreateWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 2000
                theme:
                  type: string
                  minLength: 1
                  maxLength: 50
                  default: classic
      responses:
        '201':
          description: World created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/campaign/worlds/{id}:
    put:
      tags: [Campaign Admin]
      summary: Update a world (admin only)
      operationId: adminUpdateWorld
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 2000
                theme:
                  type: string
                  minLength: 1
                  maxLength: 50
                isPublished:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Validation failed (`VALIDATION_ERROR`) or invalid id (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Campaign Admin]
      summary: Delete a world (admin only)
      operationId: adminDeleteWorld
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Invalid id (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/campaign/worlds/{id}/order:
    put:
      tags: [Campaign Admin]
      summary: Reorder a world (admin only)
      operationId: adminReorderWorld
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SortOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          description: Validation failed (`VALIDATION_ERROR`) or invalid id (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/campaign/levels:
    get:
      tags: [Campaign Admin]
      summary: List levels in a world (admin only)
      operationId: adminListLevels
      parameters:
        - name: worldId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Level summaries (including unpublished), in sort order
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignLevelSummary'
        '400':
          description: Missing or invalid `worldId` query parameter (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Campaign Admin]
      summary: Create a level (admin only)
      description: Missing fields get defaults (15x13 map, 3 lives, kill_all, unpublished). The level is appended to the end of the world.
      operationId: adminCreateLevel
      parameters:
        - name: worldId
          in: query
          schema:
            type: integer
          description: Used when the body has no `worldId`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelInput'
      responses:
        '201':
          description: Level created
          content:
