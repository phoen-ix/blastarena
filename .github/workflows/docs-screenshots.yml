name: Docs screenshots

# Regenerates the README and gallery screenshots (docs/screenshots/*.png): builds the production
# images, starts the throwaway docs stack, seeds the demo (e2e/docs/seed.ts) and runs the tour
# (e2e/docs/tour.spec.ts) - all through scripts/docs-screenshots.sh. The PNGs come back as the
# `docs-screenshots` artifact, already optimised (the script runs `oxipng -o 4 --strip safe`; the
# job installs a pinned oxipng release for it); this workflow never commits. Unzip it into
# docs/screenshots/, look at the diff and commit yourself. Unchanged screens come out
# byte-identical.
#
# Manual only: screenshots are regenerated on purpose, when a screen worth showing changed. The
# same tour runs as a render check in ci.yml (`docs-tour`), whose PNGs are thrown away.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # A pinned release, checked against its sha256 (the runner has no oxipng). Keep the version
      # in step with the one used locally: another oxipng version may compress to other bytes.
      - name: Install oxipng
        env:
          OXIPNG_VERSION: 10.2.1
          OXIPNG_SHA256: 1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17
        run: |
          name=oxipng-$OXIPNG_VERSION-x86_64-unknown-linux-musl
          curl -fsSLo "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/oxipng/oxipng/releases/download/v$OXIPNG_VERSION/$name.tar.gz"
          echo "$OXIPNG_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Run the docs tour
        env:
          ARTIFACTS: ${{ runner.temp }}/docs-artifacts
        run: bash scripts/docs-screenshots.sh "$RUNNER_TEMP/docs-screenshots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: ${{ runner.temp }}/docs-screenshots/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-tour-logs
          path: ${{ runner.temp }}/docs-artifacts/
          retention-days: 7
