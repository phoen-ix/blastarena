name: Docs screenshots

# Regenerates the README and gallery screenshots (docs/screenshots/*.png): builds the production
# images, starts the throwaway docs stack, seeds the demo (e2e/docs/seed.ts) and runs the tour
# (e2e/docs/tour.spec.ts) - all through scripts/docs-screenshots.sh. The PNGs come back as the
# `docs-screenshots` artifact; this workflow never commits. Unzip it into docs/screenshots/,
# look at the diff, optimise (oxipng) and commit yourself.
#
# Manual only: screenshots are regenerated on purpose, when a screen worth showing changed. The
# same tour runs as a render check in ci.yml (`docs-tour`), whose PNGs are thrown away.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the docs tour
        env:
          ARTIFACTS: ${{ runner.temp }}/docs-artifacts
        run: bash scripts/docs-screenshots.sh "$RUNNER_TEMP/docs-screenshots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: ${{ runner.temp }}/docs-screenshots/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-tour-logs
          path: ${{ runner.temp }}/docs-artifacts/
          retention-days: 7
