name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tests/backend/db/migrationLock.test.ts runs the migration runner against this (every other
    # backend suite mocks the database). REQUIRE_DB_TESTS on the Test step switches it on.
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci_root_pw
          MARIADB_DATABASE: blast_arena
          MARIADB_USER: blast_user
          MARIADB_PASSWORD: ci_pass_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build (every workspace, shared first)
        run: npm run build --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Format (prettier --check)
        run: npm run format:check

      - name: Test
        run: npm test
        env:
          REQUIRE_DB_TESTS: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: blast_arena
          DB_USER: blast_user
          DB_PASSWORD: ci_pass_pw

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high
