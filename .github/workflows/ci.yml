name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tests/backend/db/migrationLock.test.ts runs the migration runner against this (every other
    # backend suite mocks the database). REQUIRE_DB_TESTS on the Test step switches it on.
    services:
      mariadb:
        image: mariadb:12.3.3
        env:
          MARIADB_ROOT_PASSWORD: ci_root_pw
          MARIADB_DATABASE: blast_arena
          MARIADB_USER: blast_user
          MARIADB_PASSWORD: ci_pass_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build (every workspace, shared first)
        run: npm run build --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Format (prettier --check)
        run: npm run format:check

      - name: Test
        run: npm test
        env:
          REQUIRE_DB_TESTS: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: blast_arena
          DB_USER: blast_user
          DB_PASSWORD: ci_pass_pw

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

  # The docs screenshot tour as a render check: every screen it visits must load without a page
  # error. Its PNGs are thrown away; docs-screenshots.yml produces the ones to commit.
  docs-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the docs tour
        env:
          ARTIFACTS: ${{ runner.temp }}/docs-artifacts
        run: bash scripts/docs-screenshots.sh "$RUNNER_TEMP/docs-screenshots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-tour-logs
          path: ${{ runner.temp }}/docs-artifacts/
          retention-days: 7
