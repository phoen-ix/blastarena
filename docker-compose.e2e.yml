# Throwaway e2e / docs-tour stack: the production images with nothing on the host but one
# loopback port. Used by scripts/docs-screenshots.sh, which sets the project name and secrets:
#
#   COMPOSE_PROJECT_NAME=blastarena_docs docker compose -p blastarena_docs \
#     -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
#
# scripts/e2e.sh adds `--profile mail`: a Mailpit SMTP sink (UI/API on MAILPIT_PORT) that the
# backend sends to, so the e2e specs can open verification, reset and email-change links.
#
# - No ./data bind mounts: MariaDB runs on a tmpfs, Redis without AOF, the backend writes logs,
#   replays and AI uploads inside its container. `down -v` leaves nothing behind.
# - container_name comes from the base file (${COMPOSE_PROJECT_NAME}-<svc>), so the project name
#   must be exported as well as passed with -p. Never use blast-arena / blast-arena-dev here.
services:
  db:
    volumes: !override
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/lib/mysql

  redis:
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes: !reset []

  backend:
    volumes: !reset []
    environment:
      # Every spec and the seed reach the API from one address; the production default
      # (1000/min per IP, app.ts) is sized for players, not a parallel test suite.
      API_RATE_LIMIT_PER_MIN: 1000000
      # One fixed open-world arena and guest-name sequence (random in production): the docs
      # tour's landing and guest shots repeat run to run.
      OPEN_WORLD_SEED: 20260615
    healthcheck:
      interval: 5s

  nginx:
    build:
      args:
        VITE_E2E_HOOKS: ${VITE_E2E_HOOKS:-}
    ports: !override
      - '127.0.0.1:${PORT_BASE:-24200}:80'

  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: [mail]
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-24205}:8025'
    networks:
      - internal
