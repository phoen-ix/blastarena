# Security headers for the DEV stack.
#
# Deliberately a subset of security-headers.conf: no Content-Security-Policy, no HSTS. The dev
# server is Vite, whose HMR client uses inline scripts, eval and a WebSocket back to the dev
# server — the production CSP would break all three, and a second, looser dev CSP would be a
# policy nobody actually tests. HSTS on a plain-HTTP localhost is meaningless and would pin the
# browser to https for the dev host.
#
# These four exist here so that removing them from Express (nginx owns security headers now, see
# backend/src/app.ts) does not silently leave the dev stack with none at all.
# (audit HEADER-OWNERSHIP-1)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
