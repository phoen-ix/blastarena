worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Recover the real client address before anything else reads $remote_addr.
    #
    # Traefik terminates TLS on the host and proxies to 127.0.0.1:8280, so every request reaches
    # this container from the Docker bridge gateway. Without this block $remote_addr is that
    # gateway for EVERY visitor, which made the three limit_req zones below one shared bucket:
    # roughly three simultaneous page loads exhausted the socketio burst for the whole site, while
    # a single abusive client was indistinguishable from all legitimate traffic. It also meant the
    # access log recorded one address forever, and — because nginx forwards $remote_addr onward as
    # X-Real-IP / X-Forwarded-For — Express's `trust proxy` resolved req.ip to the gateway too.
    #
    # Why trusting this range is safe, and what it depends on:
    #  - The container publishes 127.0.0.1:8280 only, so the peer can never be an internet client;
    #    it is always the bridge gateway or loopback. The range is written broadly rather than as
    #    today's 172.19.5.0/24 because Docker reassigns the subnet whenever the network is
    #    recreated, and a stale CIDR would silently stop recovering the client IP.
    #  - Traefik declares no forwardedHeaders.trustedIPs, so it treats every client as untrusted
    #    and REPLACES inbound X-Forwarded-* rather than passing them through. A client cannot
    #    forge the header that reaches us.
    #  - real_ip_recursive is off, so nginx takes the LAST address in the chain. That is the peer
    #    Traefik itself observed, so even if Traefik were later reconfigured to append to a
    #    client-supplied chain instead of replacing it, the forged entries sit to the left and are
    #    ignored. Do not turn this on. (audit NGINX-REALIP-1)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # $remote_addr is the recovered client; $http_x_forwarded_for is the chain as received, so the
    # trust hop stays auditable and a collapse back to a single address is visible in the log.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=socketio:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # Custom error page for backend unavailability
        error_page 502 503 504 /502.html;
        location = /502.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Auth endpoints — stricter rate limit
        location /api/auth/ {
            include /etc/nginx/security-headers.conf;
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            error_page 429 @rate_limited;
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        # API proxy
        location /api/ {
            include /etc/nginx/security-headers.conf;
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            error_page 429 @rate_limited;
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Socket.io proxy with WebSocket support
        location /socket.io/ {
            include /etc/nginx/security-headers.conf;
            limit_req zone=socketio burst=20 nodelay;
            limit_req_status 429;
            error_page 429 @rate_limited;
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Static assets with aggressive caching
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Font files with aggressive caching
        location /fonts/ {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SEO files — serve directly with caching (SPA fallback would send no-cache)
        location = /robots.txt {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /sitemap.xml {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            add_header Content-Type "application/xml; charset=utf-8";
            add_header Cache-Control "public, max-age=86400";
        }

        location = /manifest.json {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=86400";
        }

        # Rate limit response with Retry-After header
        location @rate_limited {
            add_header Retry-After "60" always;
            add_header Content-Type "application/json" always;
            return 429 '{"error":"Too many requests","code":"RATE_LIMITED","retryAfter":60}';
        }

        # SPA fallback (no cache for index.html so new deploys are picked up)
        location / {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
