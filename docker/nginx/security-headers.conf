# Security headers — included in every location block that uses add_header
# (Nginx does not inherit server-level add_header into location blocks that define their own)

# CSP with a script hash for the inline theme loader in index.html <head>.
# To regenerate the hash after changing the inline script:
#   echo -n '<script content>' | openssl dgst -sha256 -binary | base64
#
# connect-src is 'self' only. It previously also listed the bare `ws:` and `wss:` schemes, which
# permit a WebSocket to ANY host — the one channel an XSS would reach for to exfiltrate. Socket.io
# connects same-origin, and 'self' already covers same-origin ws:/wss: in current browsers.
#
# Trusted Types ARE enabled. `require-trusted-types-for 'script'` makes assigning a plain string
# to innerHTML/outerHTML a TypeError in browsers that implement it, which closes the DOM-XSS sink
# class outright rather than relying on every call site remembering to escape.
#
# The frontend has exactly one HTML sink, `setHtml()` in frontend/src/utils/html.ts, which
# sanitises with DOMPurify and inserts *nodes* — so app code never touches a Trusted Types sink at
# all. An ESLint rule (`no-restricted-syntax`, eslint.config.mjs) rejects any new raw assignment,
# and tests/utils/sanitizerFidelity.test.ts asserts the sanitiser is a no-op on every HTML literal
# in the source, so the policy cannot quietly start eating real markup.
#
# `trusted-types dompurify` allow-lists the policy DOMPurify creates for itself at import time.
# Bundled library sinks were audited: Phaser's are in its DOMElement, CSSFile and ScriptFile
# loaders, none of which this app uses — and the last two are already blocked by
# `script-src 'self'` having no 'unsafe-inline'. (audit CSP-1)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-QFIiZO+8gqDzr67qavMwQvoPHecoZW3SVqb8x5tzlzo='; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'self'; require-trusted-types-for 'script'; trusted-types dompurify; upgrade-insecure-requests;" always;

# HSTS — 1 year, include subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Cross-Origin-Opener-Policy — isolate top-level browsing context
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking protection (redundant with frame-ancestors in CSP, but defense-in-depth)
add_header X-Frame-Options "SAMEORIGIN" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy — restrictive
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
