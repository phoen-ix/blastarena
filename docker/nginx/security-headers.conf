# Security headers — included in every location block that uses add_header
# (Nginx does not inherit server-level add_header into location blocks that define their own)

# CSP with a script hash for the inline theme loader in index.html <head>.
# To regenerate the hash after changing the inline script:
#   echo -n '<script content>' | openssl dgst -sha256 -binary | base64
#
# connect-src is 'self' only. It previously also listed the bare `ws:` and `wss:` schemes, which
# permit a WebSocket to ANY host — the one channel an XSS would reach for to exfiltrate. Socket.io
# connects same-origin, and 'self' already covers same-origin ws:/wss: in current browsers.
#
# NOTE: this policy does not enable Trusted Types. The header used to be labelled "CSP with
# Trusted Types" while setting neither `require-trusted-types-for` nor `trusted-types`, which read
# as a sink-level guarantee that was not in place. Turning them on would break the ~300 innerHTML
# assignments across the frontend, so it needs its own migration; the comment no longer claims
# otherwise. (audit CSP-1)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-QFIiZO+8gqDzr67qavMwQvoPHecoZW3SVqb8x5tzlzo='; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'self'; upgrade-insecure-requests;" always;

# HSTS — 1 year, include subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Cross-Origin-Opener-Policy — isolate top-level browsing context
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking protection (redundant with frame-ancestors in CSP, but defense-in-depth)
add_header X-Frame-Options "SAMEORIGIN" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy — restrictive
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
